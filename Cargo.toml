[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/remote-wrapper",
    "crates/local-bridge",
    "crates/device-client",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/Agent-Remote/agent-remote-ego-browser"

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1.40", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
x25519-dalek = { version = "3.0", features = ["static_secrets", "getrandom"] }
