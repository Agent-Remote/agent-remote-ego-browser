name: prepare-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic release version without a v prefix
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: ego-browser-prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Validate requested version and immutable tag
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "tag v${version} already exists" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Update repository-owned versions
        run: scripts/prepare-release.sh "${{ steps.version.outputs.value }}"
      - name: Verify prepared source
        run: scripts/run-quality-checks.sh
      - name: Commit, tag, and dispatch immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Cargo.toml Cargo.lock VERSION CHANGELOG.md \
            README.md README.zh-CN.md \
            docs/operations.md docs/operations.zh-CN.md \
            docs/release.md docs/release.zh-CN.md \
            protocol/test-vectors/ego-browser-bridge-v1.json
          git commit -m "chore: release v${version}"
          git tag "v${version}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${version}"
          gh workflow run release.yml --ref "v${version}" -f version="${version}"
