name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ego-browser-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Scan Rust dependencies
        run: cargo audit --json > cargo-audit.json
      - name: Run complete quality gate
        run: scripts/run-quality-checks.sh
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: cargo-audit
          path: cargo-audit.json
          if-no-files-found: error

  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - name: Test macOS local components and installer contracts
        run: |
          cargo test --workspace --all-targets --locked
          bash -n scripts/*.sh installer/*.sh
          bash installer/install-macos.sh --help
